<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Scorer Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3893797924350985"
     crossorigin="anonymous"></script>
</head>
<body>

    <div id="setup-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--accent)">MATCH SETUP</h2>
            <div class="input-group">
                <input type="text" id="t1-name" placeholder="Team 1 Name">
                <input type="text" id="t2-name" placeholder="Team 2 Name">
                <input type="number" id="match-overs" placeholder="Match Overs" value="5">
            </div>
            <div class="toss-grid">
                <div class="toss-col">
                    <label>TOSS WINNER</label>
                    <select id="toss-winner">
                        <option value="1">Team 1</option>
                        <option value="2">Team 2</option>
                    </select>
                </div>
                <div class="toss-col">
                    <label>DECISION</label>
                    <select id="toss-choice">
                        <option value="bat">BATTING</option>
                        <option value="bowl">BOWLING</option>
                    </select>
                </div>
            </div>
            <button onclick="startMatch()" class="btn-primary">START MATCH</button>
        </div>
    </div>

    <div id="entry-modal" class="modal" style="display:none;">
        <div class="modal-content animation-pop">
            <h2 id="modal-title">TITLE</h2>
            <p id="modal-desc" style="white-space: pre-line; margin: 15px 0; color: var(--text-dim);"></p>
            <div id="modal-options-grid" class="btn-grid" style="display:none; margin-bottom:15px;"></div>
            <input type="text" id="modal-input" placeholder="Type here..." autocomplete="off">
            <button id="modal-confirm-btn" onclick="submitEntry()" class="btn-primary" style="margin-top:15px">CONFIRM</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <div class="app-container">
        <header class="scoreboard">
            <div id="innings-title" class="team-name">WAITING...</div>
            <h1 id="total-score">0 - 0</h1>
            <div id="total-overs" class="overs">Overs: 0.0 / 0</div>
            <div class="secondary-stats">
                <span id="run-rate">CRR: 0.00</span>
                <span id="target-display" style="display:none;">Target: 0</span>
            </div>
            <div id="chase-tracker" style="display:none; color:var(--accent); font-weight:900; margin-top:10px;"></div>
            <div class="over-balls" id="ball-log"></div>
        </header>

        <div class="main-layout">
            <section class="bowler-selection">
                <div class="bowler-info">
                    <label>BOWLING</label>
                    <input type="text" id="current-bowler-name" readonly placeholder="Enter Bowler Name">
                </div>
                <div class="bowler-live">
                    <span>O - R - W</span>
                    <div id="bowler-live-stats">0.0 - 0 - 0 - 0</div>
                </div>
            </section>

            <section class="batting-pair">
                <div id="bat0" class="player-card">
                    <input type="text" id="name-0" class="name-input" readonly placeholder="Striker Name">
                    <div class="p-stats" id="stats-0">0 (0)</div>
                </div>
                <div id="bat1" class="player-card">
                    <input type="text" id="name-1" class="name-input" readonly placeholder="Non-Striker Name">
                    <div class="p-stats" id="stats-1">0 (0)</div>
                </div>
            </section>

            <section class="controls">
                <div class="btn-grid main-runs">
                    <button onclick="addRun(0)">0</button>
                    <button onclick="addRun(1)">1</button>
                    <button onclick="addRun(2)">2</button>
                    <button onclick="addRun(3)">3</button>
                    <button onclick="addRun(4)" class="boundary">4</button>
                    <button onclick="addRun(6)" class="boundary">6</button>
                </div>
                <div class="btn-grid action-runs" style="margin-top: 10px;">
                    <button onclick="showExtraMenu()" class="extra">EXTRA</button>
                    <button onclick="showWicketMenu()" class="wicket">WICKET</button>
                    <button onclick="addPenalty()" class="penalty-btn">PENALTY</button>
                    <button onclick="undo()" class="undo-btn">UNDO</button>
                </div>
                
                <div class="footer-actions">
                    <button onclick="preparePrint()" class="btn-pdf">PRINT PAGE</button>
                </div>
            </section>
        </div>

        <section class="history" id="printable-scorecard">
    <div id="print-header" style="text-align: center; margin-bottom: 20px;">
        <h2 id="match-status-title" style="color: var(--accent); margin-bottom: 5px;">MATCH SUMMARY</h2>
        <div id="final-result-strip" style="font-weight: 900; font-size: 1.2rem; color: #fff; background: var(--blue); padding: 10px; border-radius: 8px; display: none;"></div>
    </div>
    
    <div id="first-innings-summary" style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; display: none;">
        <h4 style="margin: 0; color: var(--text-dim); font-size: 0.8rem;">FIRST INNINGS</h4>
        <div id="t1-final-score" style="font-size: 1.5rem; font-weight: 900;"></div>
    </div>

    <div class="table-wrapper">
        <table>
            <tbody id="history-body"></tbody>
        </table>
    </div>
</section>

        <div style="margin-top: 30px; padding: 20px; text-align: center;">
            <button onclick="confirmNewGame()" class="btn-new-game">START NEW GAME</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
